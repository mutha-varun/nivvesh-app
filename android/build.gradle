plugins {
  
  id 'com.google.gms.google-services' version '4.4.2' apply false
}

import groovy.xml.XmlSlurper

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects { subproject ->
    subproject.afterEvaluate {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion 36
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("namespace") && !androidExt.namespace) {
            def manifestFile = subproject.file("src/main/AndroidManifest.xml")
            def manifestPackage = null

            if (manifestFile.exists()) {
                def manifest = new XmlSlurper(false, false).parse(manifestFile)
                manifestPackage = manifest.@package?.text()
            }

            androidExt.namespace = manifestPackage ?: "autogen.${subproject.name.replace('-', '_')}"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
